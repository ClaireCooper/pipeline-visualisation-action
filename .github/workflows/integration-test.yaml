name: Integration Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Dummy jobs to generate real timing data for the action to visualise
  job-a:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 2

  job-b:
    needs: [job-a]
    runs-on: ubuntu-latest
    steps:
      - run: sleep 2

  job-c:
    needs: [job-a]
    runs-on: ubuntu-latest
    steps:
      - run: sleep 2

  # Matrix job to test matrix variant support
  test:
    needs: [job-a]
    strategy:
      matrix:
        version: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - run: sleep 1

  # Matrix reusable workflow job to test matrix + uses: support
  deploy:
    needs: [job-b, job-c]
    strategy:
      matrix:
        env: [staging, prod]
    uses: ./.github/workflows/reusable-deploy.yaml

  # Run the action itself and upload the artifact
  run-action:
    needs: [job-b, job-c, test, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./

  # Download the artifact and validate it is well-formed
  validate:
    needs: [run-action]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pipeline-visualisation.yaml

      - name: Validate artifact
        run: |
          echo "--- pipeline-visualisation.yaml ---"
          cat pipeline-visualisation.yaml
          echo "-------------------------"
          python3 - <<'EOF'
          import re, sys

          with open("pipeline-visualisation.yaml") as f:
              content = f.read()

          # Normalise durations so we can compare structure without caring about exact values
          normalised = re.sub(r'duration: \d+', 'duration: N', content)

          expected = """\
          integration-test:
            jobs:
              job-a:
                duration: N
              job-b:
                duration: N
                needs:
                  - job-a
              job-c:
                duration: N
                needs:
                  - job-a
              test (1):
                duration: N
                needs:
                  - job-a
              test (2):
                duration: N
                needs:
                  - job-a
              deploy (prod):
                uses: reusable-deploy (prod)
                needs:
                  - job-b
                  - job-c
              deploy (staging):
                uses: reusable-deploy (staging)
                needs:
                  - job-b
                  - job-c
          reusable-deploy (prod):
            jobs:
              deploy-step-a:
                duration: N
              deploy-step-b:
                duration: N
                needs:
                  - deploy-step-a
          reusable-deploy (staging):
            jobs:
              deploy-step-a:
                duration: N
              deploy-step-b:
                duration: N
                needs:
                  - deploy-step-a
          """

          # Strip consistent leading indentation from the heredoc
          import textwrap
          expected = textwrap.dedent(expected)

          if normalised != expected:
              print("EXPECTED:")
              print(expected)
              print("GOT:")
              print(normalised)
              sys.exit(1)

          print("Validation passed.")
          EOF
